plugins {
    id "com.android.application"
}

def readEnvFile = { File file ->
    def values = [:]
    if (!file.exists()) return values

    file.eachLine { rawLine ->
        def line = rawLine.trim()
        if (!line || line.startsWith("#")) return
        def separator = line.indexOf("=")
        if (separator <= 0) return
        def key = line.substring(0, separator).trim()
        def value = line.substring(separator + 1).trim()
        if (value.length() >= 2 &&
                ((value.startsWith('"') && value.endsWith('"')) ||
                 (value.startsWith("'") && value.endsWith("'")))) {
            value = value.substring(1, value.length() - 1)
        }
        values[key] = value
    }
    values
}

def env = readEnvFile(rootProject.file(".env.local"))
if (env.isEmpty()) {
    env = readEnvFile(rootProject.file("ui/.env.local"))
}
def configuredAppUrl = providers.gradleProperty("SANSKRITI_APP_URL").orNull ?:
        System.getenv("SANSKRITI_APP_URL") ?:
        env["SANSKRITI_APP_URL"] ?:
        env["NEXT_PUBLIC_APP_URL"] ?:
        "https://appassets.androidplatform.net/"
def escapedAppUrl = configuredAppUrl.replace("\\", "\\\\").replace('"', '\\"')
def escapeBuildConfig = { String value ->
    (value ?: "").replace("\\", "\\\\").replace('"', '\\"')
}

android {
    namespace "ai.sanskriti.app"
    compileSdk 36

    defaultConfig {
        applicationId "ai.sanskriti.app"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "APP_URL", "\"${escapedAppUrl}\""
        buildConfigField "String", "NVIDIA_API_KEY", "\"${escapeBuildConfig(env["NVIDIA_API_KEY"])}\""
        buildConfigField "String", "NVIDIA_CHAT_MODEL", "\"${escapeBuildConfig(env["NVIDIA_MODEL"] ?: "nvidia/nemotron-3-nano-30b-a3b")}\""
        buildConfigField "String", "NVIDIA_VISION_MODEL", "\"${escapeBuildConfig(env["NVIDIA_VISION_MODEL"] ?: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning")}\""
        buildConfigField "String", "NVIDIA_SPEECH_MODEL", "\"${escapeBuildConfig(env["NVIDIA_SPEECH_MODEL"] ?: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning")}\""
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        // Next.js stores its runtime in `_next`; AAPT ignores underscore-prefixed
        // directories by default, so keep the standard ignores without `<dir>_*`.
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

def bundleMobileUi = tasks.register("bundleMobileUi", Exec) {
    workingDir rootProject.projectDir
    commandLine "bash", "scripts/build-mobile-ui.sh"
    inputs.dir rootProject.file("ui/app")
    inputs.dir rootProject.file("ui/components")
    inputs.dir rootProject.file("ui/hooks")
    inputs.dir rootProject.file("ui/lib")
    inputs.dir rootProject.file("ui/public")
    inputs.file rootProject.file("ui/next.config.ts")
    inputs.file rootProject.file("ui/package.json")
    outputs.dir rootProject.file("app/src/main/assets/www")
}

tasks.named("preBuild").configure {
    dependsOn bundleMobileUi
}
